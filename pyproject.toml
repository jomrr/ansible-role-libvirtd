[project]
name = "libvirtd"
version = "0.0.0"
description = "Ansible role for a QEMU/KVM host with libvirt management and GuestFS tools."
authors = ["Jonas Mauer"]
license = "MIT"
keywords = ["libvirt", "libvirtd", "kvm", "qemu", "virtualization"]
repository = "https://github.com/jomrr/ansible-role-libvirtd"

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
branch = "main"
commit_message = "build(release): version {version}"
major_on_zero = true
upload_to_pypi = false
upload_to_vcs_release = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
]

[tool.tox]
envlist = ["lint"]

[tool.tox.env.lint]
description = "Lint code"
skip_install = true
deps = ["ansible-lint"]
commands = [["ansible-lint", "--offline"]]
