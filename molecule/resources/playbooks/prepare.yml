---
# role: libvirtd
# file: molecule/resources/playbooks/prepare.yml

- name: LIBVIRTD | Prepare isolated virtualization hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: LIBVIRTD | Wait for test containers
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: LIBVIRTD | Refresh Debian package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == 'Debian'

    - name: LIBVIRTD | Create a preexisting supplementary group
      become: true
      become_user: root
      ansible.builtin.group:
        name: libvirt-molecule-other

    - name: LIBVIRTD | Create a preexisting local user
      become: true
      become_user: root
      ansible.builtin.user:
        name: libvirt-molecule
        groups: libvirt-molecule-other
